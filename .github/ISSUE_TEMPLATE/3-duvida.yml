name: "Tirar uma dúvida"
description: "Uma pergunta sobre como usar o noType."
title: "[Dúvida] "
labels: ["dúvida"]
body:
  - type: textarea
    id: duvida
    attributes:
      label: "Qual é a sua dúvida?"
    validations:
      required: true
  - type: input
    id: versao-app
    attributes:
      label: "Versão do noType"
      description: "Aparece em Sobre, dentro do app."
      placeholder: "1.0.0"
    validations:
      required: true
