name: "Sugerir uma melhoria"
description: "Uma ideia para o noType ficar melhor."
title: "[Ideia] "
labels: ["melhoria", "triagem"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: "Qual é a ideia?"
    validations:
      required: true
  - type: textarea
    id: situacao
    attributes:
      label: "Que situação ela resolve?"
      description: "Conte quando você sentiu falta disso. Ajuda a entender a prioridade."
  - type: textarea
    id: extra
    attributes:
      label: "Algo mais?"
      description: "Exemplos, imagens ou outros apps que fazem parecido."
